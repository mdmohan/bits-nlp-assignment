# Candidate corpus registry for the Group 1 language-modelling experiments.
# `download` is read by data_download.py; the other fields document the data.
manifest_version: 1

corpora:
  brown:
    title: Brown Corpus
    status: candidate
    language: English
    domain: Mixed genres of American English prose
    source:
      provider: NLTK Data
      url: https://www.nltk.org/nltk_data/
      package: brown
    version: NLTK data package; record the download date and NLTK version used.
    license: Check the upstream corpus and NLTK package terms before redistribution.
    limitations: Historical corpus; genre and vocabulary may differ from contemporary text.
    download:
      type: nltk
      package: brown
    extract-path: corpora/brown
    ignore-files:
      - cats.txt

  gutenberg:
    title: Project Gutenberg corpus (NLTK collection)
    status: candidate
    language: English
    domain: Public-domain books and literary prose
    source:
      provider: NLTK Data
      url: https://www.nltk.org/nltk_data/
      package: gutenberg
    version: NLTK data package; record the download date and NLTK version used.
    license: Verify the status and terms for each included book, including the country of use.
    limitations: Books are not independent samples from a single writing domain.
    download:
      type: nltk
      package: gutenberg
    extract-path: corpora/gutenberg
    ignore-files:
      - README

  webtext:
    title: NLTK WebText corpus
    status: candidate
    language: English
    domain: Informal web text
    source:
      provider: NLTK Data
      url: https://www.nltk.org/nltk_data/
      package: webtext
    version: NLTK data package; record the download date and NLTK version used.
    license: Check the upstream corpus and NLTK package terms before redistribution.
    limitations: Small, heterogeneous set of web documents; inspect content before use.
    download:
      type: nltk
      package: webtext
    ignore-files:
      - firefox.txt

  inaugural:
    title: US Presidential Inaugural Addresses (NLTK collection)
    status: candidate
    language: English
    domain: Formal political speeches
    source:
      provider: NLTK Data
      url: https://www.nltk.org/nltk_data/
      package: inaugural
    version: NLTK data package; record the download date and NLTK version used.
    license: Check the upstream corpus and NLTK package terms before redistribution.
    limitations: Narrow genre and strong historical/time-period effects.
    download:
      type: nltk
      package: inaugural

  reuters:
    title: Reuters-21578 corpus (NLTK collection)
    status: candidate
    language: English
    domain: Newswire
    source:
      provider: NLTK Data
      url: https://www.nltk.org/nltk_data/
      package: reuters
    version: NLTK data package; record the download date and NLTK version used.
    license: Check the upstream corpus and NLTK package terms before redistribution.
    limitations: Newswire domain; source documents may have collection-specific structure.
    download:
      type: nltk
      package: reuters
    extract-path: corpora/reuters
    include-extensionless: true
    ignore-files:
      - cats.txt
      - README
      - stopwords

  blog-posts:
    title: Blog posts (local archive)
    status: candidate
    language: English
    domain: Informal blog text
    source:
      provider: Local archive
    version: Record the archive source/revision and access date.
    license: Verify the original blog sources and redistribution terms before sharing.
    limitations: Blog topics, writing styles, and document lengths may vary substantially.
    preprocessing: "Convert the extracted XML corpus to text with src/data-pipeline/process_blog_xml.py, which uses extract_blog_posts.py and clean_blog_artifacts.py. It writes one text file per source XML with one post per line before the standard pipeline cleaning and loading stages."
    download:
      type: local
      package: data/raw/blog-posts.zip
    extract-path: data/raw/extracted/blog-posts
    remove-words:
      - urlLink
      - nbsp
    remove-regex:
      - 'https?://\S+'
      - '\b[A-Za-z][A-Za-z0-9_]{2,30}:\s*[-–—]{2,}'
      - '!{2,}'
      - '\?{2,}'
      - '\b[A-Za-z]{20,}\b'
      - '(?i)\(?\b\d{1,2}:\d{2}:\d{2}\s*[AP]M\b\)?'
      - '\bwww\.[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?:/[^\s]*)?'
    # Select this fraction of source documents before cleaning/loading.
    # The percentage applies to document count, not bytes, sentences, or tokens.
    sampling:
      sample-percent: 10
      sample-seed: 3999

  roc-stories:
    title: ROC Stories (local archive)
    status: candidate
    language: English
    domain: Short commonsense narrative stories
    source:
      provider: Local archive
    version: Record the archive source/revision and access date.
    license: Verify the upstream dataset license and redistribution terms before sharing.
    limitations: Short, curated stories may not represent general-purpose text.
    download:
      type: local
      package: data/raw/roc-stories.zip
    extract-path: data/raw/extracted/roc-stories

# For a corpus archive copied into the repository, use a local source. Paths in
# `download.package` and `extract-path` are relative to the project root (or may
# be absolute). Keep extraction outside `data.output` so raw files cannot be
# mistaken for processed corpus files on later runs.
#   ptb-local:
#     title: Penn Treebank archive (local copy)
#     status: candidate
#     language: English
#     domain: Edited news text
#     source: {provider: Local archive, url: https://www.nltk.org/nltk_data/}
#     version: Record archive source and access date.
#     license: Check upstream corpus and package terms before redistribution.
#     limitations: Treebank text is preprocessed and may contain tokenization conventions.
#     download:
#       type: local
#       package: data/raw/ptb.tar.gz
#     extract-path: data/raw/extracted/ptb

# URL-based corpus example (copy and fill in when choosing a direct downloadable file):
#   my-url-corpus:
#     title: Descriptive dataset title
#     status: candidate
#     language: English
#     domain: Describe the text domain
#     source:
#       provider: Publisher or repository name
#       url: https://example.org/dataset
#     version: Dataset release or revision
#     license: License name and link; verify redistribution terms
#     accessed: YYYY-MM-DD
#     limitations: Known sampling or coverage limitations
#     download:
#       type: url
#       url: https://example.org/files/corpus.zip
#       filename: corpus.zip       # optional; defaults to the URL filename
#       sha256: ...                # optional; checked when provided

# For the corpus you select, add these optional documentation fields as you collect them.
#   version: Release/tag or NLTK package revision
#   accessed_on: YYYY-MM-DD
#   license_url: https://example.org/license
#   files: [{path: ..., sha256: ..., bytes: ...}]
#   document_count: ...
#   sentence_count: ...
#   token_count: ...
#   preprocessing: Describe cleaning, sentence splitting, and tokenization.
#   split: {unit: document, test_ratio: 0.2, seed: 55}
#   leakage_checks: Describe exact/near-duplicate checks across train and test.
#   evaluation: Record which models/metrics were used to compare this corpus.
# `extract-path`, `ignore-files`, `include-extensionless`, `remove-words`, and
# `remove-regex` are operational. `sampling` selects a seeded percentage of
# source documents immediately after extraction and before cleaning/loading.
# The removal fields are used only when cleaning is enabled, and each is an array.
#   remove-words: [urlLink, nbsp]
#   remove-regex: ['https?://\\S+', '\\bfoo\\d+']
